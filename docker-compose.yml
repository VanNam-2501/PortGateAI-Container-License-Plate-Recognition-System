version: '3.8'

services:
  smart-gate-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-gate:latest
    container_name: smart-gate-service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./config:/workspace/config
      - ./data/uploads:/workspace/data/uploads
      - ./outputs/results:/workspace/outputs/results
      - ./logs:/workspace/logs
      - ./models:/workspace/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
